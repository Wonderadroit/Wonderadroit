name: Digital Identity Lab

on:
  pull_request:
    paths:
      - "PROJECT_FRONTIER/labs/digital-identity/**"
      - ".github/workflows/digital-identity-lab.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: PROJECT_FRONTIER/labs/digital-identity
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install package and test dependency
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .
      - name: Run unit tests
        run: python -m unittest discover -s tests -v
